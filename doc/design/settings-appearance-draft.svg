<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title description">
  <title id="title">Settings — Appearance, first design draft</title>
  <desc id="description">A compact neutral dark Settings window. Five planned sections appear in the left navigation. Appearance contains hue, accent strength and surface tint controls and a controls preview. Cancel, disabled Apply and highlighted OK are at the bottom. The first implementation offers Appearance only.</desc>
  <defs>
    <linearGradient id="button" x2="0" y2="1">
      <stop offset="0" stop-color="#404040"/>
      <stop offset="1" stop-color="#333333"/>
    </linearGradient>
    <linearGradient id="primary" x2="0" y2="1">
      <stop offset="0" stop-color="#4a664f"/>
      <stop offset="1" stop-color="#3b5440"/>
    </linearGradient>
    <style>
      text { font-family: Inter, sans-serif; font-size: 13.333px; fill: #e4e4e4; }
      .small { font-size: 12px; fill: #ababab; }
      .muted { fill: #ababab; }
      .heading { font-size: 14.667px; font-weight: 600; }
      .semibold { font-weight: 600; }
      .disabled { fill: #696969; }
      .mark { fill: none; stroke: #ababab; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Native title decoration is illustrative. Implementation uses DialogWindow. -->
  <rect width="760" height="560" fill="#222222"/>
  <rect width="760" height="32" fill="#292929"/>
  <text x="16" y="21">Settings</text>
  <path class="mark" d="M731 11l10 10m0-10l-10 10"/>

  <!-- Existing ListFrame and selection treatment; navigation has keyboard focus. -->
  <rect x="16.5" y="48.5" width="159" height="439" rx="4" fill="#161616" stroke="#9ccca4" stroke-opacity="0.5"/>
  <rect x="24.5" y="60.5" width="143" height="27" rx="4" fill="#9ccca4" fill-opacity="0.28" stroke="#9ccca4" stroke-opacity="0.85"/>
  <text x="36" y="79">Appearance</text>
  <text x="36" y="115">Viewing</text>
  <text x="36" y="151">Browser</text>
  <text x="36" y="187">Files</text>
  <text x="36" y="223">Thumbnails</text>

  <text class="heading" x="192" y="69">Appearance</text>
  <text class="small" x="192" y="92">Neutral surfaces with a restrained green accent.</text>

  <!-- Standard sliders and numeric spin boxes; no new control type. -->
  <text x="192" y="138">Hue</text>
  <rect x="340" y="132" width="280" height="4" rx="2" fill="#161616" stroke="#0f0f0f"/>
  <rect x="340" y="132" width="117" height="4" rx="2" fill="#9ccca4"/>
  <circle cx="457" cy="134" r="8" fill="#e4e4e4" stroke="#0f0f0f"/>
  <rect x="644.5" y="120.5" width="99" height="27" rx="4" fill="#161616" stroke="#454545"/>
  <text x="656" y="138">150°</text>
  <path class="mark" d="M729 130l3-3 3 3m-6 8l3 3 3-3"/>

  <text x="192" y="182">Accent strength</text>
  <rect x="340" y="176" width="280" height="4" rx="2" fill="#161616" stroke="#0f0f0f"/>
  <rect x="340" y="176" width="140" height="4" rx="2" fill="#9ccca4"/>
  <circle cx="480" cy="178" r="8" fill="#e4e4e4" stroke="#0f0f0f"/>
  <rect x="644.5" y="164.5" width="99" height="27" rx="4" fill="#161616" stroke="#454545"/>
  <text x="656" y="182">0.075</text>
  <path class="mark" d="M729 174l3-3 3 3m-6 8l3 3 3-3"/>

  <text x="192" y="226">Surface tint</text>
  <rect x="340" y="220" width="280" height="4" rx="2" fill="#161616" stroke="#0f0f0f"/>
  <circle cx="348" cy="222" r="8" fill="#e4e4e4" stroke="#0f0f0f"/>
  <rect x="644.5" y="208.5" width="99" height="27" rx="4" fill="#161616" stroke="#454545"/>
  <text x="656" y="226">0.000</text>
  <path class="mark" d="M729 218l3-3 3 3m-6 8l3 3 3-3"/>
  <text class="small" x="340" y="254">0 keeps surfaces and text neutral.</text>

  <text class="semibold" x="192" y="285">Controls preview</text>
  <rect x="192.5" y="298.5" width="551" height="159" rx="4" fill="#222222" stroke="#e4e4e4" stroke-opacity="0.12"/>

  <rect x="208.5" y="314.5" width="183" height="127" rx="4" fill="#161616" stroke="#e4e4e4" stroke-opacity="0.12"/>
  <text class="small" x="220" y="334">Example list</text>
  <rect x="212.5" y="344.5" width="175" height="27" rx="4" fill="#9ccca4" fill-opacity="0.18" stroke="#9ccca4" stroke-opacity="0.60"/>
  <text x="224" y="363">Selected item</text>
  <text x="224" y="395">Another item</text>
  <text class="disabled" x="224" y="427">Disabled item</text>

  <rect x="416" y="316" width="16" height="16" rx="3" fill="#9ccca4"/>
  <path d="M419.5 324.5l3 3 6-7" fill="none" stroke="#161616" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="440" y="329">Sample option</text>
  <rect x="416.5" y="350.5" width="311" height="27" rx="4" fill="#161616" stroke="#454545"/>
  <text x="428" y="368">Sample text</text>

  <rect x="416.5" y="398.5" width="143" height="27" rx="4" fill="url(#primary)" stroke="#7ea385"/>
  <path d="M420 400h136" stroke="#e4e4e4" stroke-opacity="0.18"/>
  <text x="488" y="416" text-anchor="middle">Default button</text>
  <rect x="576.5" y="398.5" width="151" height="27" rx="4" fill="url(#button)" stroke="#4d4d4d"/>
  <path d="M580 400h144" stroke="#e4e4e4" stroke-opacity="0.08"/>
  <text x="652" y="416" text-anchor="middle">Button</text>

  <text class="small" x="192" y="481">Changes preview immediately; saved only with Apply or OK.</text>

  <path d="M16 502.5h728" stroke="#e4e4e4" stroke-opacity="0.12"/>
  <rect x="16.5" y="516.5" width="143" height="27" rx="4" fill="url(#button)" stroke="#4d4d4d"/>
  <path d="M20 518h136" stroke="#e4e4e4" stroke-opacity="0.08"/>
  <text x="88" y="534" text-anchor="middle">Reset appearance</text>
  <rect x="488.5" y="516.5" width="79" height="27" rx="4" fill="url(#button)" stroke="#4d4d4d"/>
  <path d="M492 518h72" stroke="#e4e4e4" stroke-opacity="0.08"/>
  <text x="528" y="534" text-anchor="middle">Cancel</text>
  <rect x="576.5" y="516.5" width="79" height="27" rx="4" fill="#292929" stroke="#292929"/>
  <text class="disabled" x="616" y="534" text-anchor="middle">Apply</text>
  <rect x="664.5" y="516.5" width="79" height="27" rx="4" fill="url(#primary)" stroke="#7ea385"/>
  <path d="M668 518h72" stroke="#e4e4e4" stroke-opacity="0.18"/>
  <text x="704" y="534" text-anchor="middle">OK</text>
</svg>
